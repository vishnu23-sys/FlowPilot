<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded-square badge -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#sheen)"/>

  <!-- speed streak behind the plane -->
  <path d="M20 70 q14 -6 24 -14" stroke="#ffffff" stroke-opacity="0.45"
        stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- paper plane: bright wing -->
  <path d="M52 22 L26 76 L52 62 Z" fill="#ffffff"/>
  <!-- paper plane: shaded wing (the fold) -->
  <path d="M52 22 L52 62 L78 74 Z" fill="#ffffff" fill-opacity="0.72"/>
</svg>
